<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Claire — AI Research and Engineering</title>
  <desc id="desc">LLM post-training, tool-using agents, speech and audio. A task, rollout, verifier, and update loop illustrates the research themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#0b1222"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66e3d0"/><stop offset="1" stop-color="#ad9bff"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a9bed8" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7185a9" stroke-width="1.2"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="378" rx="24" fill="url(#bg)" stroke="#2c3d59"/>
  <rect x="700" y="1" width="499" height="378" rx="24" fill="url(#grid)"/>
  <path d="M48 42H112" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="48" y="82" fill="#9bacc8" font-size="18" font-weight="600" letter-spacing="3.2">AI RESEARCH &amp; ENGINEERING</text>
    <text x="44" y="181" fill="#f4f7ff" font-size="94" font-weight="700" letter-spacing="-3">Claire<tspan fill="#66e3d0">.</tspan></text>
    <text x="48" y="232" fill="#d7e2f4" font-size="25">LLM post-training · tool-using agents</text>
    <text x="48" y="271" fill="#d7e2f4" font-size="25">speech &amp; audio</text>
    <text x="48" y="333" fill="#8c9fbd" font-size="17">Tsinghua University  /  Shenzhen, China</text>
  </g>
  <g fill="none" stroke="#7185a9" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M866 126H953"/>
    <path d="M1041 150V223"/>
    <path d="M952 251H868"/>
    <path d="M778 223V151"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" text-anchor="middle">
    <rect x="710" y="96" width="156" height="58" rx="14" fill="#152b3b" stroke="#3b8f8b"/>
    <text x="788" y="132" fill="#92eee0">Task</text>
    <rect x="953" y="96" width="176" height="58" rx="14" fill="#1d2340" stroke="#7d6aae"/>
    <text x="1041" y="132" fill="#cec2ff">Rollout</text>
    <rect x="953" y="223" width="176" height="58" rx="14" fill="#152b3b" stroke="#3b8f8b"/>
    <text x="1041" y="259" fill="#92eee0">Verifier</text>
    <rect x="710" y="223" width="156" height="58" rx="14" fill="#1d2340" stroke="#7d6aae"/>
    <text x="788" y="259" fill="#cec2ff">Update</text>
  </g>
  <circle cx="910" cy="189" r="33" fill="#131f35" stroke="#293d5d"/>
  <path d="M893 189H899L905 177L913 201L919 187L925 189H929" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="919" y="333" text-anchor="middle" fill="#8194b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" letter-spacing="1.1">BUILD  ·  MEASURE  ·  LEARN</text>
